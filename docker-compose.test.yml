services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/usr/app
      - api-node-modules:/usr/app/node_modules
      - ./.test-static:/usr/app/static
    environment:
      NODE_ENV: test
      PORT: 8080
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme_test
      DATABASE_SCHEMA: public
      CLIENT_URL: http://localhost:13000
    ports:
      - '${TEST_API_PORT:-18080}:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:8080/permissions', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile-web
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/usr/app
      - web-node-modules:/usr/app/node_modules
      - ./.test-static:/usr/app/static
      - ./static:/usr/app/test-static-source:ro
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme_test
      API_URL: http://api:8080
    command: >-
      sh -c 'cp -n /usr/app/test-static-source/* /usr/app/static/ 2>/dev/null || true;
      npm run web:dev'
    ports:
      - '${TEST_WEB_PORT:-13000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/ >/dev/null']
      interval: 2s
      timeout: 5s
      retries: 30

  runner:
    build:
      context: .
      dockerfile: Dockerfile-api
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - .:/usr/app
      - api-node-modules:/usr/app/node_modules
      - ./.test-static:/usr/app/static
    environment:
      NODE_ENV: test
      PORT: 8081
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme_test
      DATABASE_SCHEMA: public
      CLIENT_URL: http://localhost:13000
      API_URL: http://api:8080
      WEB_URL: http://web:3000
    command: npm run test:functional

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examme_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d examme_test']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  api-node-modules:
  web-node-modules:
  postgres-data:
