<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · {{ siteName }}</title>
    <meta name="description" content="{{ siteDescription }}" />
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header>
      <nav class="navbar navbar-expand-md bg-white border-bottom">
        <div class="container">
          <a class="navbar-brand fw-semibold" href="/">{{ siteName }}</a>
          <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#navigation"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navigation">
            <ul class="navbar-nav me-auto">
              <li class="nav-item"><a class="nav-link" href="/exams">Exams</a></li>
              <li class="nav-item"><a class="nav-link" href="/questions">Questions</a></li>
              <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
            </ul>
            <ul class="navbar-nav">
              {% if currentUser %}
              <li class="nav-item"><a class="nav-link" href="/{{ currentUser.slug }}">{{ currentUser.name }}</a></li>
              <li class="nav-item">
                <form method="post" action="/logout">
                  <button class="nav-link btn btn-link" type="submit">Logout</button>
                </form>
              </li>
              {% else %}
              <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main class="flex-grow-1">
      <div class="container py-4">{% block content %}{% endblock %}</div>
    </main>
    <footer class="bg-white border-top mt-5">
      <div class="container py-3 text-secondary small">© {{ siteName }}</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
