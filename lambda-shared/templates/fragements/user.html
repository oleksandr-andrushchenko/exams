<a class="list-group-item list-group-item-action" href="/{{ user.slug }}">
  {% if user.imageFilename %}
  <img
    class="entity-image"
    src="/static/{{ user.imageFilename }}"
    alt="{{ user.name or user.id }}"
    loading="lazy"
  >
  {% endif %}
  <strong>{{ user.name or user.id }}</strong>
  <span class="d-block small text-secondary">Joined {{ user.createdAt or '' }}</span>
  <span class="d-block">
    <span class="rating-stars" style="--rating: {{ user.rating.averageMark or 0 }}">★★★★★</span>
    <span class="small text-secondary">
      {{ (user.rating.averageMark or 0) | round(1) }}/5 ({{ user.rating.markCount or 0 }} votes)
    </span>
  </span>
</a>
