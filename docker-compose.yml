services:
  be:
    build:
      context: .
      dockerfile: Dockerfile-be
    depends_on:
      - postgres
    volumes:
      - .:/usr/app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme
      DATABASE_SCHEMA: public
      CLIENT_URL: http://localhost:${FE_PORT}
    ports:
      - "${BE_PORT}:8080"

  fe:
    build:
      context: .
      dockerfile: Dockerfile-fe
    volumes:
      - .:/usr/app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8081
      API_BASE_URL: http://be:8080
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme
      DATABASE_SCHEMA: public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BE_PORT}
    ports:
      - "${FE_PORT}:8081"

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  postgres-data:
