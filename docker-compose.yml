services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-api
    depends_on:
      - postgres
    volumes:
      - .:/usr/app
      - api-node-modules:/usr/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: ${ENV:-development}
      PORT: 8080
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme
      DATABASE_SCHEMA: public
      CLIENT_URL: http://localhost:${WEB_PORT}
    ports:
      - '${API_PORT}:8080'

  web:
    build:
      context: .
      dockerfile: Dockerfile-web
    depends_on:
      - postgres
    volumes:
      - .:/usr/app
      - web-node-modules:/usr/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: ${ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examme
      API_URL: http://localhost:${API_PORT}
    ports:
      - '${WEB_PORT}:3000'

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

volumes:
  api-node-modules:
  web-node-modules:
  postgres-data:
