<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>{{ title }} · {{ siteName }}</title>
  <meta content="{{ siteDescription }}" name="description"/>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96"/>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
  <link rel="shortcut icon" href="/static/favicon.ico"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-title" content="{{ siteName }}"/>
  <link rel="manifest" href="/static/site.webmanifest"/>
  <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;700&display=swap"
        rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/static/styles.css" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">
<header>
  <nav class="navbar navbar-expand-md bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="bi bi-folder-check"></i>
        {{ siteName }}
      </a>
      <button
              aria-label="Toggle navigation"
              class="navbar-toggler"
              data-bs-target="#navigation"
              data-bs-toggle="collapse"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navigation">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/exams">Exams</a></li>
          <li class="nav-item"><a class="nav-link" href="/questions">Questions</a></li>
          <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link btn btn-primary btn-sm my-1 ms-md-2" href="{% if currentUser %}/exams/new{% else %}/login?redirect=%2Fexams%2Fnew{% endif %}">
              <i class="bi bi-plus-circle"></i>
              Create exam
            </a>
          </li>
          {% if currentUser %}
          <li class="nav-item">
            <a class="nav-link" href="/{{ currentUser.slug }}">
              <i class="bi bi-person-circle"></i>
              {{ currentUser.name }}
            </a>
          </li>
          <li class="nav-item">
            <form action="/logout" method="post">
              <button class="nav-link btn btn-link" type="submit">
                Logout
                <i class="bi bi-box-arrow-right"></i>
              </button>
            </form>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link" href="/login">
              <i class="bi bi-box-arrow-in-right"></i>
              Login
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
<main>
  <div class="container pb-3">{% block content %}{% endblock %}</div>
</main>
<footer class="bg-white border-top mt-5">
  <div class="container py-3 text-secondary small">© {{ siteName }}</div>
</footer>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
