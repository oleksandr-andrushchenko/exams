{% extends "layout.html" %}

{% block content %}
<h1>Edit {{ question.title }}</h1>
<form class="card card-body d-flex gap-3" enctype="multipart/form-data" method="post" data-api-form="updateQuestion"
      data-resource-id="{{ question.id }}" data-success-url="{{ questionUrl(question, question.exam) }}">
    <label>
        Title
        <textarea class="form-control" name="title" required>{{ question.title }}</textarea></label>

    <label>
        Difficulty
        <input class="form-control" name="difficulty" required value="{{ question.difficulty or '' }}"/>
    </label>

    <label>
        Type
        <input class="form-control" name="type" required value="{{ question.type or '' }}"/>
    </label>

    <label>
        Image
        <input accept="image/jpeg,image/png,image/gif,image/webp" class="form-control" name="image" type="file"/>
    </label>

    <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
