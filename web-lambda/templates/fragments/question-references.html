{% if question.reference_urls %}
    <div class="mt-3">
        <h4 class="h6">References</h4>
        <ul class="mb-0">
            {% for reference_url in question.reference_urls %}
                <li><a href="{{ reference_url }}" target="_blank"
                       rel="nofollow noopener noreferrer">{{ reference_url }}</a></li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
