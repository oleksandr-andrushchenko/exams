<div class="d-flex align-items-center gap-2 mb-3">
    <span class="badge {{ 'text-bg-success' if question.status == QuestionStatus.PUBLISHED else 'text-bg-danger' if question.status == QuestionStatus.REJECTED else 'text-bg-warning' }}">
        {{ question.status.value|title }}
    </span>
    {% if question.comment %}<small class="text-body-secondary">{{ question.comment }}</small>{% endif %}
</div>
{% if cur_user and check_auth(cur_user, Permission.UPDATE_QUESTION_STATUS) %}
    <form id="question-status-form" class="card card-body mb-3" novalidate>
        <label class="form-label" for="question-status">Publication status</label>
        <select class="form-select mb-2" id="question-status" name="status">
            {% for status in QuestionStatus %}
                <option value="{{ status.value }}" {% if question.status == status %}selected{% endif %}>{{ status.value|title }}</option>
            {% endfor %}
        </select>
        <label class="form-label" for="question-status-comment">Rejection reason</label>
        <input class="form-control mb-2" id="question-status-comment" name="comment" maxlength="2000"
               value="{{ question.comment or '' }}" placeholder="Required when rejecting">
        <button class="btn btn-outline-primary align-self-start" type="submit">
            <i class="bi bi-check2-circle" aria-hidden="true"></i> Save status
        </button>
    </form>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        handleFormSubmit("#question-status-form", {{ url('update-question-status', exam_id=exam.id, question_id=question.id, absolute=True) | tojson }}, {
          method: "POST",
          onSuccess: () => {
            window.location.reload()
            return "Status saved."
          },
        })
      })
    </script>
{% endif %}
