<section class="card border-primary-subtle bg-primary-subtle">
    <div class="card-body">
        <h2 class="h5 card-title text-primary-emphasis">
            <i class="bi bi-pencil-square"></i>
            Become an author
        </h2>

        <p class="card-text">
            Share your ideas and earn money from your content.
        </p>

        <a href="{{ url('new-exam') if cur_user else url('login', redirect_url=url('new-exam')) }}"
           class="btn btn-primary btn-sm bi bi-pencil-fill"{% if not cur_user %} rel="nofollow"{% endif %}>
            Write an exam
        </a>
        <a href="{{ url("earn") }}" class="btn btn-outline-primary btn-sm bi bi-currency-dollar">
            Earn with us
        </a>
    </div>
</section>
